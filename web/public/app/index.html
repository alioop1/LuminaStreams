<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LuminaStreams">
  <meta name="theme-color" content="#070b14">
  <meta name="mobile-web-app-capable" content="yes">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.gstatic.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' https: data: blob:; media-src * blob: data:; connect-src *;">
  <title>LuminaStreams</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/icon.png">
  <link rel="icon" type="image/png" href="assets/icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css?v=11">
</head>
<body>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- PS5 Top Navigation Bar (LUMINA STREAMS, 10 Circular Buttons, Clock) -->
  <!-- ═══════════════════════════════════════════════════════════ -->
  <header id="ps5-top-bar" class="ps5-top-bar">
    <!-- Left Logo (matches wsa_screen.png) -->
    <div class="ps5-logo" onclick="window.Router && window.Router.navigate('home')">
      <span class="ps5-logo-lumina">LUMINA</span>
      <span class="ps5-logo-streams">STREAMS</span>
    </div>

    <!-- Center Icon Bar (10 PS5 circular glass buttons) -->
    <nav class="ps5-nav-group" aria-label="Main Navigation">
      <!-- Search -->
      <button class="ps5-nav-btn" data-screen="search" title="חיפוש" aria-label="חיפוש">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </button>

      <!-- Home -->
      <button class="ps5-nav-btn active" data-screen="home" title="בית" aria-label="בית">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
          <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
        </svg>
      </button>

      <!-- Movies -->
      <button class="ps5-nav-btn" data-screen="movies" title="סרטים" aria-label="סרטים">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
          <path d="M18 4l2 4h-3l-2-4h-2l2 4h-3l-2-4H8l2 4H7L5 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4h-4z"/>
        </svg>
      </button>

      <!-- Series -->
      <button class="ps5-nav-btn" data-screen="series" title="סדרות" aria-label="סדרות">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
          <path d="M21 3H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h5v2h8v-2h5c1.1 0 1.99-.9 1.99-2L23 5c0-1.1-.9-2-2-2zm0 14H3V5h18v12z"/>
        </svg>
      </button>

      <!-- Fuzer (Sparkles) -->
      <button class="ps5-nav-btn" data-screen="fuzer" title="Fuzer" aria-label="Fuzer">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
          <path d="M19 9l1.25-2.75L23 5l-2.75-1.25L19 1l-1.25 2.75L15 5l2.75 1.25L19 9zm-7.5.5L9 4 6.5 9.5 1 12l5.5 2.5L9 20l2.5-5.5L17 12l-5.5-2.5zM19 15l-1.25 2.75L15 19l2.75 1.25L19 23l1.25-2.75L23 19l-2.75-1.25L19 15z"/>
        </svg>
      </button>

      <!-- IPTV -->
      <button class="ps5-nav-btn" data-screen="iptv" title="IPTV" aria-label="IPTV">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
          <path d="M21 3H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h5v1h-2v2h12v-2h-2v-1h5c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 12H3V5h18v10z"/>
        </svg>
      </button>

      <!-- Debrid / Cloud -->
      <button class="ps5-nav-btn" data-screen="auth" title="Cloud" aria-label="Cloud">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
          <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/>
        </svg>
      </button>

      <!-- Watchlist -->
      <button class="ps5-nav-btn" data-screen="watchlist" title="רשימה שלי" aria-label="רשימה שלי">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        </svg>
      </button>

      <!-- Settings -->
      <button class="ps5-nav-btn" data-screen="settings" title="הגדרות" aria-label="הגדרות">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
          <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
        </svg>
      </button>

      <!-- Profile -->
      <button class="ps5-nav-btn" data-screen="auth" id="nav-profile" title="חשבון" aria-label="חשבון">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/>
        </svg>
      </button>
    </nav>

    <!-- Right Actions / Clock -->
    <div class="ps5-top-actions">
      <button class="ps5-mobile-header-btn" data-screen="search" title="חיפוש" aria-label="חיפוש">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </button>
      <div class="ps5-clock" id="ps5-clock">00:00</div>
    </div>
  </header>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- App Container                                              -->
  <!-- ═══════════════════════════════════════════════════════════ -->
  <div id="app">
    <!-- Main Content Area -->
    <main id="content">
      <div id="screen-container"></div>
    </main>
  </div>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- Video Player Overlay (hidden by default)                   -->
  <!-- ═══════════════════════════════════════════════════════════ -->
  <div id="player-overlay" class="hidden">
    <video id="video-player" playsinline webkit-playsinline></video>

    <!-- Player Controls -->
    <div id="player-controls">
      <!-- Top Bar -->
      <div class="player-top-bar">
        <button id="player-back" class="player-btn" aria-label="Back">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"/>
          </svg>
        </button>
        <span id="player-title" class="player-title"></span>
      </div>

      <!-- Progress Bar -->
      <div class="player-progress-wrapper">
        <span id="player-time-current" class="player-time">00:00</span>
        <div id="player-progress-bar" class="player-progress-bar">
          <div id="player-progress-buffered" class="player-progress-buffered"></div>
          <div id="player-progress-played" class="player-progress-played"></div>
          <div id="player-progress-thumb" class="player-progress-thumb"></div>
        </div>
        <span id="player-time-duration" class="player-time">00:00</span>
      </div>

      <!-- Bottom Bar -->
      <div class="player-bottom-bar">
        <div class="player-controls-left">
          <!-- Play / Pause -->
          <button id="player-play-pause" class="player-btn player-btn-lg" aria-label="Play/Pause">
            <svg id="icon-play" width="28" height="28" viewBox="0 0 24 24" fill="currentColor" stroke="none">
              <polygon points="5 3 19 12 5 21 5 3"/>
            </svg>
            <svg id="icon-pause" width="28" height="28" viewBox="0 0 24 24" fill="currentColor" stroke="none" class="hidden">
              <rect x="6" y="4" width="4" height="16"/>
              <rect x="14" y="4" width="4" height="16"/>
            </svg>
          </button>

          <!-- Skip Backward 10s -->
          <button id="player-skip-back" class="player-btn" aria-label="Skip back 10s">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="1 4 1 10 7 10"/>
              <path d="M3.51 15C4.16 17.02 5.47 18.77 7.23 19.95C8.99 21.14 11.1 21.69 13.21 21.51C15.32 21.33 17.31 20.44 18.86 18.97C20.41 17.5 21.42 15.55 21.73 13.45C22.04 11.36 21.63 9.22 20.57 7.39C19.51 5.55 17.86 4.12 15.88 3.33C13.9 2.53 11.71 2.42 9.66 3.01C7.62 3.6 5.83 4.86 4.58 6.57"/>
              <text x="12" y="14" text-anchor="middle" fill="currentColor" stroke="none" font-size="8" font-weight="600">10</text>
            </svg>
          </button>

          <!-- Skip Forward 10s -->
          <button id="player-skip-forward" class="player-btn" aria-label="Skip forward 10s">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="23 4 23 10 17 10"/>
              <path d="M20.49 15C19.84 17.02 18.53 18.77 16.77 19.95C15.01 21.14 12.9 21.69 10.79 21.51C8.68 21.33 6.69 20.44 5.14 18.97C3.59 17.5 2.58 15.55 2.27 13.45C1.96 11.36 2.37 9.22 3.43 7.39C4.49 5.55 6.14 4.12 8.12 3.33C10.1 2.53 12.29 2.42 14.34 3.01C16.38 3.6 18.17 4.86 19.42 6.57"/>
              <text x="12" y="14" text-anchor="middle" fill="currentColor" stroke="none" font-size="8" font-weight="600">10</text>
            </svg>
          </button>

          <!-- Volume -->
          <div class="player-volume-group">
            <button id="player-mute" class="player-btn" aria-label="Mute/Unmute">
              <svg id="icon-volume-on" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                <path d="M19.07 4.93C20.94 6.8 22 9.34 22 12C22 14.66 20.94 17.2 19.07 19.07"/>
                <path d="M15.54 8.46C16.48 9.4 17 10.67 17 12C17 13.33 16.48 14.6 15.54 15.54"/>
              </svg>
              <svg id="icon-volume-off" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="hidden">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                <line x1="23" y1="9" x2="17" y2="15"/>
                <line x1="17" y1="9" x2="23" y2="15"/>
              </svg>
            </button>
            <input id="player-volume-slider" type="range" min="0" max="100" value="80" class="player-volume-slider" aria-label="Volume">
          </div>
        </div>

        <div class="player-controls-right">
          <!-- Subtitles -->
          <button id="player-subtitles" class="player-btn" aria-label="Subtitles">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="4" width="20" height="16" rx="2"/>
              <path d="M7 12H9"/>
              <path d="M11 12H17"/>
              <path d="M7 16H13"/>
              <path d="M15 16H17"/>
            </svg>
          </button>

          <!-- Audio Tracks -->
          <button id="player-audio" class="player-btn" aria-label="Audio tracks">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 18V5L21 3V16"/>
              <circle cx="6" cy="18" r="3"/>
              <circle cx="18" cy="16" r="3"/>
            </svg>
          </button>

          <!-- Playback Speed -->
          <button id="player-speed" class="player-btn player-speed-label" aria-label="Playback speed">
            1x
          </button>

          <!-- Open in External Player (VLC / Outplayer) -->
          <button id="player-external" class="player-btn" aria-label="External Player" title="פתח בנגן חיצוני (VLC / Outplayer)">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
              <polyline points="15 3 21 3 21 9"/>
              <line x1="10" y1="14" x2="21" y2="3"/>
            </svg>
          </button>

          <!-- Picture-in-Picture -->
          <button id="player-pip" class="player-btn" aria-label="Picture in Picture">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="3" width="20" height="14" rx="2"/>
              <rect x="12" y="9" width="8" height="6" rx="1"/>
            </svg>
          </button>

          <!-- Fullscreen -->
          <button id="player-fullscreen" class="player-btn" aria-label="Fullscreen">
            <svg id="icon-fullscreen-enter" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="15 3 21 3 21 9"/>
              <polyline points="9 21 3 21 3 15"/>
              <polyline points="21 3 14 10"/>
              <polyline points="3 21 10 14"/>
            </svg>
            <svg id="icon-fullscreen-exit" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="hidden">
              <polyline points="4 14 10 14 10 20"/>
              <polyline points="20 10 14 10 14 4"/>
              <polyline points="14 10 21 3"/>
              <polyline points="10 14 3 21"/>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <!-- Subtitle / Audio Track Selector Popup -->
    <div id="track-selector" class="hidden">
      <div class="track-selector-header">
        <span id="track-selector-title"></span>
        <button id="track-selector-close" class="player-btn" aria-label="Close">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div id="track-selector-list" class="track-selector-list"></div>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- Modal Overlay                                              -->
  <!-- ═══════════════════════════════════════════════════════════ -->
  <div id="modal-overlay" class="hidden">
    <div id="modal-content"></div>
  </div>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- Toast Container                                            -->
  <!-- ═══════════════════════════════════════════════════════════ -->
  <div id="toast-container"></div>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- Loading Splash (shown until app initialises)               -->
  <!-- ═══════════════════════════════════════════════════════════ -->
  <div id="splash-loader">
    <div class="splash-logo">L</div>
    <div class="splash-text">LuminaStreams</div>
    <div class="splash-spinner"></div>
  </div>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- Mobile Bottom Tab Bar (iOS Native Navigation)               -->
  <!-- Visible ONLY in Portrait mode on mobile                      -->
  <!-- ═══════════════════════════════════════════════════════════ -->
  <nav id="mobile-bottom-nav" class="mobile-bottom-nav" aria-label="Mobile Navigation">
    <button class="mobile-nav-item active" data-screen="home" title="בית" aria-label="בית">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
        <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
      </svg>
      <span>בית</span>
    </button>

    <button class="mobile-nav-item" data-screen="movies" title="סרטים" aria-label="סרטים">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
        <path d="M18 4l2 4h-3l-2-4h-2l2 4h-3l-2-4H8l2 4H7L5 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4h-4z"/>
      </svg>
      <span>סרטים</span>
    </button>

    <button class="mobile-nav-item" data-screen="series" title="סדרות" aria-label="סדרות">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
        <path d="M21 3H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h5v2h8v-2h5c1.1 0 1.99-.9 1.99-2L23 5c0-1.1-.9-2-2-2zm0 14H3V5h18v12z"/>
      </svg>
      <span>סדרות</span>
    </button>

    <button class="mobile-nav-item" data-screen="search" title="חיפוש" aria-label="חיפוש">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="7"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <span>חיפוש</span>
    </button>

    <button class="mobile-nav-item" data-screen="watchlist" title="רשימה שלי" aria-label="רשימה שלי">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
      </svg>
      <span>רשימה</span>
    </button>

    <button class="mobile-nav-item" data-screen="settings" title="הגדרות" aria-label="הגדרות">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
        <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
      </svg>
      <span>הגדרות</span>
    </button>
  </nav>
