[versions]
agp             = "8.10.1"
kotlin          = "2.1.21"
coreKtx         = "1.15.0"
junit           = "4.13.2"
junitVersion    = "1.2.1"
espressoCore    = "3.6.1"
appcompat       = "1.7.0"
material        = "1.12.0"
tvFoundation    = "1.0.0-alpha11"
tvMaterial      = "1.0.0"
lifecycle       = "2.8.7"
activityCompose = "1.9.3"
navigationCompose = "2.8.7"
material3       = "1.3.1"
media3          = "1.5.0"
coil            = "2.7.0"
paletteKtx      = "1.0.0"
securityCrypto  = "1.1.0-alpha06"
retrofit        = "2.11.0"
okhttp          = "4.12.0"
jsoup           = "1.18.3"
coroutines      = "1.9.0"
composeUi       = "1.7.6"
gson            = "2.11.0"
datastore       = "1.2.1"
zxing           = "3.5.4"
room            = "2.7.0"
ksp             = "2.1.21-2.0.1"

[libraries]
# ── AndroidX core ──────────────────────────────────────────────────────────
androidx-core-ktx   = { group = "androidx.core",     name = "core-ktx",   version.ref = "coreKtx" }
androidx-appcompat  = { group = "androidx.appcompat", name = "appcompat",  version.ref = "appcompat" }
material            = { group = "com.google.android.material", name = "material", version.ref = "material" }

# ── Lifecycle ──────────────────────────────────────────────────────────────
androidx-lifecycle-runtime-ktx      = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx",      version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-ktx    = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx",    version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose  = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose",  version.ref = "lifecycle" }

# ── Activity / Navigation ──────────────────────────────────────────────────
androidx-activity-compose    = { group = "androidx.activity",  name = "activity-compose",    version.ref = "activityCompose" }
androidx-navigation-compose  = { group = "androidx.navigation", name = "navigation-compose",  version.ref = "navigationCompose" }

# ── Compose ────────────────────────────────────────────────────────────────
androidx-compose-ui                      = { group = "androidx.compose.ui",        name = "ui",                      version.ref = "composeUi" }
androidx-compose-ui-graphics             = { group = "androidx.compose.ui",        name = "ui-graphics",             version.ref = "composeUi" }
androidx-compose-ui-tooling-preview      = { group = "androidx.compose.ui",        name = "ui-tooling-preview",      version.ref = "composeUi" }
androidx-compose-material3               = { group = "androidx.compose.material3", name = "material3",               version.ref = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material",  name = "material-icons-extended", version.ref = "composeUi" }

# ── TV ─────────────────────────────────────────────────────────────────────
androidx-tv-foundation  = { group = "androidx.tv", name = "tv-foundation", version.ref = "tvFoundation" }
androidx-tv-material    = { group = "androidx.tv", name = "tv-material",   version.ref = "tvMaterial" }

# ── Media3 / ExoPlayer ────────────────────────────────────────────────────
androidx-media3-exoplayer         = { group = "androidx.media3", name = "media3-exoplayer",          version.ref = "media3" }
androidx-media3-ui                = { group = "androidx.media3", name = "media3-ui",                 version.ref = "media3" }
androidx-media3-exoplayer-hls     = { group = "androidx.media3", name = "media3-exoplayer-hls",      version.ref = "media3" }
androidx-media3-exoplayer-dash    = { group = "androidx.media3", name = "media3-exoplayer-dash",     version.ref = "media3" }
androidx-media3-datasource-okhttp = { group = "androidx.media3", name = "media3-datasource-okhttp",  version.ref = "media3" }
androidx-media3-common            = { group = "androidx.media3", name = "media3-common",             version.ref = "media3" }
androidx-media3-decoder           = { group = "androidx.media3", name = "media3-decoder",            version.ref = "media3" }

# ── Coil 2 ────────────────────────────────────────────────────────────────
coil-compose  = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }

# ── Palette ────────────────────────────────────────────────────────────────
androidx-palette-ktx    = { group = "androidx.palette",  name = "palette-ktx",    version.ref = "paletteKtx" }

# ── Security ───────────────────────────────────────────────────────────────
androidx-security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "securityCrypto" }

# ── Network ────────────────────────────────────────────────────────────────
retrofit                   = { group = "com.squareup.retrofit2", name = "retrofit",            version.ref = "retrofit" }
retrofit-converter-gson    = { group = "com.squareup.retrofit2", name = "converter-gson",      version.ref = "retrofit" }
okhttp                     = { group = "com.squareup.okhttp3",   name = "okhttp",               version.ref = "okhttp" }
okhttp-logging-interceptor = { group = "com.squareup.okhttp3",   name = "logging-interceptor",  version.ref = "okhttp" }
jsoup                      = { group = "org.jsoup",              name = "jsoup",                version.ref = "jsoup" }
gson                       = { group = "com.google.code.gson",   name = "gson",                 version.ref = "gson" }

# ── Coroutines ─────────────────────────────────────────────────────────────
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# ── Room / Datastore / ZXing ───────────────────────────────────────────────
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
zxing-core    = { group = "com.google.zxing", name = "core",          version.ref = "zxing" }
room-runtime  = { group = "androidx.room",    name = "room-runtime",  version.ref = "room" }
room-ktx      = { group = "androidx.room",    name = "room-ktx",      version.ref = "room" }
room-compiler = { group = "androidx.room",    name = "room-compiler", version.ref = "room" }

# ── Test ───────────────────────────────────────────────────────────────────
junit                  = { group = "junit",                   name = "junit",         version.ref = "junit" }
androidx-junit         = { group = "androidx.test.ext",       name = "junit",         version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso",  name = "espresso-core", version.ref = "espressoCore" }

[plugins]
android-application = { id = "com.android.application",              version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android",         version.ref = "kotlin" }
compose-compiler    = { id = "org.jetbrains.kotlin.plugin.compose",  version.ref = "kotlin" }
ksp                 = { id = "com.google.devtools.ksp",              version.ref = "ksp" }
