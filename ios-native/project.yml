name: LuminaStreams
options:
  bundleIdPrefix: com.luminastreams
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "14.3"
  objectVersion: 56
  generateEmptyDirectories: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO

packages:
  # MobileVLCKit 3.6.0 — plays MKV/AVI/WebM, HEVC, AC3/EAC3/DTS/TrueHD and
  # embedded SRT/ASS/PGS, which AVPlayer cannot (debrid torrents are mostly MKV).
  VLCKitSPM:
    url: https://github.com/tylerjonesio/vlckit-spm
    exactVersion: 3.6.0

targets:
  LuminaStreams:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: LuminaStreams
    dependencies:
      - package: VLCKitSPM
        product: VLCKitSPM
    # XcodeGen regenerates Info.plist from these properties on every build,
    # so every key the app needs must be listed here, not only in the plist.
    info:
      path: LuminaStreams/Info.plist
      properties:
        CFBundleDisplayName: LuminaStreams
        CFBundleDevelopmentRegion: he
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Debrid CDNs, IPTV panels and EPG feeds are often plain http.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        LSApplicationQueriesSchemes:
          - vlc-x-callback
          - vlc
          - infuse
          - outplayer
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.luminastreams.ios
        PRODUCT_NAME: LuminaStreams
        INFOPLIST_FILE: LuminaStreams/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
